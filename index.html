<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>CRM Surta</title>
<link rel="icon" type="image/png" href="assets/logo-surta.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js" integrity="sha384-DhxhYObIMeMNGyAG7iK11OHzBIKyEIeRL0ad1iFPAOwZB8iirUlTT0O/WJJUk8+o" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.js" integrity="sha384-l7yJnh/cWKcqeTC5adHUdc5b+J4Kb2QTGRSkCQehn1YT5xEFlrgwnXOYuvrtI1F6" crossorigin="anonymous"></script>
<link rel="stylesheet" href="index.css">
</head>
<body class="auth-open">

<!-- ────────────── LOGIN ────────────── -->
<div id="auth-screen" class="auth-screen">
  <div class="auth-card" id="auth-card">
    <div class="auth-logo">
      <img src="assets/logo-surta.png" alt="Surta">
    </div>
    <h1>CRM</h1>
    <p class="auth-sub" id="auth-sub">Carregando sessão…</p>
    <p class="auth-admin-note hidden" id="auth-admin-note">A conta só é criada por um administrador. Solicite o acesso à equipe responsável.</p>
    <div id="auth-setup" class="auth-setup hidden"></div>
    <form id="auth-form" class="hidden">
      <div class="form-group">
        <label for="auth-email">E-mail</label>
        <input id="auth-email" type="email" autocomplete="username" required placeholder="voce@empresa.com" maxlength="254">
      </div>
      <div class="form-group" id="auth-pass-wrap">
        <label for="auth-password">Senha</label>
        <input id="auth-password" type="password" autocomplete="current-password" required maxlength="128" placeholder="Sua senha">
      </div>
      <div class="form-group hidden" id="auth-pass2-wrap">
        <label for="auth-password2">Confirmar senha</label>
        <input id="auth-password2" type="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="Repita a senha">
      </div>
      <div class="auth-error hidden" id="auth-error"></div>
      <button type="submit" class="btn btn-primary auth-submit" id="auth-submit">Entrar</button>
    </form>
    <div class="auth-links hidden" id="auth-links"></div>
  </div>
</div>

<div id="sidebar-backdrop" class="sidebar-backdrop" data-action="close-menu"></div>
<!-- ────────────── SIDEBAR ────────────── -->
<nav id="sidebar" aria-label="Menu principal">
  <div class="sidebar-logo">
    <img src="assets/logo-surtavet-white.png" alt="Surtavet marketing veterinário">
  </div>
  <div class="sidebar-nav" id="sidebar-nav">
    <div class="nav-item active" data-action="navigate" data-view="dashboard"><span>Dashboard</span></div>
    <div class="nav-item" data-action="navigate" data-view="leads"><span>Leads</span></div>
    <div class="nav-item" data-action="navigate" data-view="pipeline"><span>Pipeline</span></div>
    <div class="nav-item" data-action="navigate" data-view="clients"><span>Clientes</span></div>
    <div class="nav-item" data-action="navigate" data-view="tasks"><span>Tarefas</span></div>
    <div class="nav-item" data-action="navigate" data-view="agenda"><span>Conteúdos</span></div>
    <div class="nav-item" data-action="navigate" data-view="import"><span>Importar Leads</span></div>
    <div class="nav-item" data-action="navigate" data-view="reports"><span>Relatórios</span></div>
    <div class="nav-item" data-action="navigate" data-view="backup"><span>Backup</span></div>
    <div class="nav-item hidden" id="nav-users" data-action="navigate" data-view="users"><span>Usuários</span></div>
  </div>
  <div class="sidebar-footer">
    <div class="sidebar-user">
      <div style="min-width:0;flex:1">
        <div id="user-name">Social Media</div>
        <div id="user-email">Manager</div>
        <div id="user-role" class="sidebar-role hidden"></div>
      </div>
    </div>
    <button type="button" class="btn btn-sm sidebar-logout" data-action="logout" id="btn-logout">Sair</button>
  </div>
</nav>

<!-- ────────────── MAIN ────────────── -->
<div id="main">
  <div class="topbar">
    <div class="topbar-start">
      <button type="button" class="menu-btn" id="menu-btn" data-action="toggle-menu" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false">
        <span class="menu-btn-bars" aria-hidden="true"></span>
      </button>
      <div class="topbar-title" id="page-title">Dashboard</div>
    </div>
    <div class="topbar-actions">
      <span id="save-indicator" class="save-indicator"></span>
      <button type="button" class="btn btn-primary btn-sm hide-sm" data-action="sync-claude" title="Baixa crm_data.json — manda para o Claude no chat para sincronizar com Firefox" style="font-weight:700">Sincronizar</button>
      <button type="button" class="btn btn-secondary btn-sm hide-sm" data-action="firefox-html" title="Baixa HTML completo com seus dados embutidos" style="border-color:#FF6611;color:#FF6611;font-weight:700">Abrir no Firefox</button>
      <button type="button" class="btn btn-secondary btn-sm hide-sm" data-action="restore-open" data-target="restore-file" title="Restaurar backup">Restaurar</button>
      <input type="file" id="restore-file" accept=".json" style="display:none">
      <button type="button" class="btn btn-secondary hide-sm" data-action="export-csv">Exportar CSV</button>
      <button type="button" class="btn btn-primary" data-action="open-lead">+ Novo Lead</button>
    </div>
  </div>
  <div class="content" id="content"></div>
</div>

<!-- ────────────── MODAL ────────────── -->
<div class="modal-overlay hidden" id="modal-overlay">
  <div class="modal" id="the-modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Novo Lead</div>
      <button type="button" class="modal-close" data-action="close-modal" aria-label="Fechar">×</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer" id="modal-footer"></div>
  </div>
</div>

<!-- ────────────── TOAST ────────────── -->
<div class="toast-container" id="toasts"></div>

<script src="config.js"></script>
<script src="index.js"></script>
</body>
</html>
